# ZXTune transcoding rules for Lyrion Music Server / Logitech Media Server (Daphile)

zxt flc * *
	# F:{PATH=%f}R:{PATH=%F}T:{START=--start=%s}
	[zxtune-play] --format flac $START$ "$PATH$"

zxt wav * *
	# F:{PATH=%f}R:{PATH=%F}T:{START=--start=%s}
	[zxtune-play] --format wav $START$ "$PATH$"

zxt pcm * *
	# F:{PATH=%f}R:{PATH=%F}T:{START=--start=%s}
	[zxtune-play] --format wav $START$ "$PATH$"

zxt mp3 * *
	# F:{PATH=%f}R:{PATH=%F}B:{BITRATE=--bitrate=%B}T:{START=--start=%s}
	[zxtune-play] --format mp3 $BITRATE$ $START$ "$PATH$"
